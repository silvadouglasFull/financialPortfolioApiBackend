version: '3.8'

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile # Assume que o Dockerfile do Laravel está na raiz, ou ajuste o caminho
    container_name: financial_portfolio_laravel
    environment:
      # Variáveis de ambiente para o Laravel, carregadas do arquivo .env
      APP_ENV=local
      APP_DEBUG=true
      APP_URL=http://localhost
      DB_CONNECTION=mysql
      DB_HOST=${DB_HOST}
      DB_PORT=${DB_PORT}
      DB_DATABASE=${DB_DATABASE}
      DB_USERNAME=${DB_USERNAME}
      DB_PASSWORD=${DB_PASSWORD}
    volumes:
      # Mapeia o código da aplicação do host para o container
      - .:/var/www
      # Mapeia as configurações do Nginx
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker-compose/nginx/sites-available:/etc/nginx/sites-available
    ports:
      # Mapeamento da porta do Nginx no container (80) para a porta 80 do host
      - ["80:80"]
    networks:
      - app-network
    depends_on:
      - mysql # Adicionar o MySQL aqui para garantir que o Laravel espere ele iniciar

networks:
  app-network:
    driver: bridge

# Seção de volumes (já incluída no trecho anterior, mas importante para a completude)
# volumes:
#   mysql_data: # Este volume deve ser definido no docker-compose.yml completo
#     driver: local