services:
  laravel:
    build:
      args:
        user: financialPortfolioApiBackend
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: php:8.4-fpm
    container_name: financialPortfolioApiBackend-laravel
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - financialPortfolioApiBackend-network

  nginx:
    image: nginx:alpine
    container_name: financialPortfolioApiBackend-nginx
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - financialPortfolioApiBackend-network

networks:
  financialPortfolioApiBackend-network:
    driver: bridge
